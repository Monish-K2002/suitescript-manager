name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: suitescript-manager

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: suitescript-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: xvfb-run -a npm test

  package:
    name: Build and package extension
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: suitescript-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VS Code extension
        run: npx @vscode/vsce package --out suitescript-manager.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: suitescript-manager-vsix
          path: suitescript-manager/suitescript-manager.vsix
          if-no-files-found: error
          retention-days: 7

